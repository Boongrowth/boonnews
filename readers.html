<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Primary Base SEO Meta Tags -->
  <title id="metaTitle">BoonNews | Reader</title>
  <meta name="title" id="metaTitleTag" content="BoonNews | Read Article">
  <meta name="description" id="metaDescription" content="Read full news articles, analysis, and breaking updates on BoonNews.">
  <meta name="keywords" content="BoonNews, news, breaking news, articles, insights, blog">
  <meta name="robots" content="index, follow">
  <link rel="canonical" id="metaCanonical" href="https://boonnews.vercel.app/reader.html">

  <!-- Open Graph / WhatsApp / Facebook / LinkedIn -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="BoonNews">
  <meta property="og:url" id="ogUrl" content="https://boonnews.vercel.app/reader.html">
  <meta property="og:title" id="ogTitle" content="BoonNews | Read Article">
  <meta property="og:description" id="ogDescription" content="Read full news articles, analysis, and breaking updates on BoonNews.">
  <meta property="og:image" id="ogImage" content="https://boonnews.vercel.app/boon-news-og-banner.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" id="twitterUrl" content="https://boonnews.vercel.app/reader.html">
  <meta name="twitter:title" id="twitterTitle" content="BoonNews | Read Article">
  <meta name="twitter:description" id="twitterDescription" content="Read full news articles, analysis, and breaking updates on BoonNews.">
  <meta name="twitter:image" id="twitterImage" content="https://boonnews.vercel.app/boon-news-og-banner.jpg">

  <!-- Schema.org JSON-LD Structured Data -->
  <script type="application/ld+json" id="articleSchema">
  {
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "headline": "Read Article",
    "image": ["https://boonnews.vercel.app/boon-news-og-banner.jpg"],
    "publisher": {
      "@type": "Organization",
      "name": "BoonNews",
      "logo": {
        "@type": "ImageObject",
        "url": "https://boonnews.vercel.app/boon-news-og-banner.jpg"
      }
    }
  }
  </script>

  <!-- External Stylesheets & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #0dcaf0;
      --text-main: #f3f4f6;
    }

    body {
      background-color: var(--bg-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
    }

    .navbar-custom {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }

    .article-header-img {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    .article-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .badge-category {
      background: rgba(13, 110, 253, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(13, 202, 240, 0.25);
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 12px;
    }

    .article-content {
      line-height: 1.8;
      font-size: 1.1rem;
      color: #e5e7eb;
    }

    .points-alert {
      background: rgba(13, 202, 240, 0.1);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      border-radius: 12px;
      padding: 12px 18px;
    }

    /* Social Share Buttons Styling */
    .share-bar {
      border-top: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 0;
      margin: 24px 0;
    }

    .btn-share {
      border: none;
      border-radius: 50px;
      padding: 8px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn-share:hover {
      opacity: 0.9;
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-whatsapp { background-color: #25D366; }
    .btn-twitter { background-color: #000000; border: 1px solid var(--card-border); }
    .btn-facebook { background-color: #1877F2; }
    .btn-copy { background-color: var(--bg-secondary); border: 1px solid var(--card-border); color: var(--text-main); }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold text-white fs-4" href="index.html">
      <i class="fa fa-bolt text-primary me-2"></i>BoonNews
    </a>
    <div class="ms-auto">
      <a href="index.html" class="btn btn-sm btn-outline-light rounded-pill px-3">&larr; Back to Feed</a>
    </div>
  </div>
</nav>

<div class="container py-3">
  <div class="article-container">
    
    <div id="rewardAlertContainer"></div>

    <div id="articleLoader" class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <div class="mt-2 text-muted">Loading content...</div>
    </div>

    <div id="articleBody" class="d-none">
      <div class="mb-3">
        <span id="articleCategory" class="badge-category">News</span>
        <span id="articleDate" class="text-muted ms-2 small"></span>
      </div>

      <h1 id="articleTitle" class="fw-bold mb-3 text-white"></h1>

      <div class="d-flex align-items-center text-muted mb-3 small">
        <span><i class="fa fa-user me-1"></i><span id="articleAuthor">Editorial</span></span>
        <span class="mx-2">•</span>
        <span><i class="far fa-clock me-1"></i><span id="articleReadTime">1</span>m read</span>
      </div>

      <!-- Top Social Share Bar -->
      <div class="share-bar d-flex flex-wrap align-items-center justify-content-between gap-2">
        <span class="small text-muted fw-bold"><i class="fa fa-share-nodes me-1"></i> SHARE</span>
        <div class="d-flex flex-wrap gap-2">
          <a id="shareWhatsApp" href="#" target="_blank" class="btn-share btn-whatsapp">
            <i class="fab fa-whatsapp"></i> WhatsApp
          </a>
          <a id="shareTwitter" href="#" target="_blank" class="btn-share btn-twitter">
            <i class="fab fa-x-twitter"></i> Post
          </a>
          <a id="shareFacebook" href="#" target="_blank" class="btn-share btn-facebook">
            <i class="fab fa-facebook-f"></i> Share
          </a>
          <button id="shareCopy" class="btn-share btn-copy">
            <i class="fa fa-link"></i> <span id="copyBtnText">Copy Link</span>
          </button>
        </div>
      </div>

      <img id="articleImage" class="article-header-img mb-4" src="" alt="Article Banner">

      <div id="articleText" class="article-content mb-5"></div>

      <!-- Bottom Social Share Bar -->
      <div class="share-bar d-flex flex-wrap align-items-center justify-content-between gap-2">
        <span class="small text-muted fw-bold">Enjoyed this story? Share it:</span>
        <div class="d-flex flex-wrap gap-2">
          <a id="shareWhatsAppBottom" href="#" target="_blank" class="btn-share btn-whatsapp">
            <i class="fab fa-whatsapp"></i>
          </a>
          <a id="shareTwitterBottom" href="#" target="_blank" class="btn-share btn-twitter">
            <i class="fab fa-x-twitter"></i>
          </a>
          <a id="shareFacebookBottom" href="#" target="_blank" class="btn-share btn-facebook">
            <i class="fab fa-facebook-f"></i>
          </a>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
  import { 
    getAuth, onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-auth.js";
  import { 
    getFirestore, doc, getDoc, updateDoc, setDoc, arrayUnion, increment 
  } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBfoxEnVep0wX5V_KVS-cd8o5sUMvrFY4c",
  authDomain: "primeintelmedia-e2fe3.firebaseapp.com",
  databaseURL: "https://primeintelmedia-e2fe3-default-rtdb.firebaseio.com",
  projectId: "primeintelmedia-e2fe3",
  storageBucket: "primeintelmedia-e2fe3.firebasestorage.app",
  messagingSenderId: "228866357632",
  appId: "1:228866357632:web:72dc9942f1cd41d857a965",
  measurementId: "G-G0HRRV932S"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const FALLBACK_IMG = 'https://boonnews.vercel.app/boon-news-og-banner.jpg';

  const urlParams = new URLSearchParams(window.location.search);
  const articleId = urlParams.get('id');

  if (!articleId) {
    window.location.href = "index.html";
  }

  loadArticleDetails(articleId);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      await processRewardPoints(user.uid, articleId);
    } else {
      showGuestNotice();
    }
  });

  async function loadArticleDetails(id) {
    try {
      const docRef = doc(db, "newsPosts", id);
      const snap = await getDoc(docRef);

      if (snap.exists()) {
        const post = snap.data();
        const articleTitle = post.title || "Untitled Article";
        const articleSummary = post.summary || (post.content ? post.content.replace(/<[^>]*>?/gm, '').substring(0, 155) : "Read article on BoonNews.");
        const articleImg = post.imageUrl || FALLBACK_IMG;
        const currentUrl = window.location.href;
        const authorName = post.author || "Editorial";

        // Render UI Elements
        document.getElementById("articleTitle").innerText = articleTitle;
        document.getElementById("articleCategory").innerText = post.category || "General";
        document.getElementById("articleAuthor").innerText = authorName;
        document.getElementById("articleReadTime").innerText = post.minutesRead || "1";
        document.getElementById("articleImage").src = articleImg;
        document.getElementById("articleText").innerHTML = post.content || `<p>${articleSummary}</p>`;

        if (post.createdAt) {
          const rawTime = post.createdAt.toMillis ? post.createdAt.toMillis() : post.createdAt.seconds * 1000;
          document.getElementById("articleDate").innerText = new Date(rawTime).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric'
          });
        }

        // Setup Social Share Links
        setupShareLinks(articleTitle, currentUrl);

        // Dynamically update SEO
        updateDynamicMeta({
          title: `${articleTitle} | BoonNews`,
          description: articleSummary,
          image: articleImg,
          url: currentUrl,
          author: authorName
        });

        // Increment article view count
        updateDoc(docRef, { views: increment(1) }).catch(() => {});

        document.getElementById("articleLoader").classList.add("d-none");
        document.getElementById("articleBody").classList.remove("d-none");
      } else {
        document.getElementById("articleLoader").innerHTML = `<div class="text-danger">Article not found.</div>`;
      }
    } catch (err) {
      console.error("Error fetching article details:", err);
      document.getElementById("articleLoader").innerHTML = `<div class="text-danger">Failed to load content.</div>`;
    }
  }

  function setupShareLinks(title, url) {
    const encodedTitle = encodeURIComponent(title);
    const encodedUrl = encodeURIComponent(url);

    const whatsappUrl = `https://api.whatsapp.com/send?text=${encodedTitle}%20${encodedUrl}`;
    const twitterUrl = `https://twitter.com/intent/tweet?text=${encodedTitle}&url=${encodedUrl}`;
    const facebookUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;

    // Top buttons
    document.getElementById("shareWhatsApp").href = whatsappUrl;
    document.getElementById("shareTwitter").href = twitterUrl;
    document.getElementById("shareFacebook").href = facebookUrl;

    // Bottom buttons
    document.getElementById("shareWhatsAppBottom").href = whatsappUrl;
    document.getElementById("shareTwitterBottom").href = twitterUrl;
    document.getElementById("shareFacebookBottom").href = facebookUrl;

    // Copy link handler
    document.getElementById("shareCopy").addEventListener("click", () => {
      navigator.clipboard.writeText(url).then(() => {
        const copyText = document.getElementById("copyBtnText");
        copyText.innerText = "Copied!";
        setTimeout(() => { copyText.innerText = "Copy Link"; }, 2000);
      }).catch(err => console.error("Could not copy link: ", err));
    });
  }

  function updateDynamicMeta({ title, description, image, url, author }) {
    document.title = title;

    const setMeta = (id, value) => {
      const el = document.getElementById(id);
      if (el) el.setAttribute("content", value);
    };

    setMeta("metaTitleTag", title);
    setMeta("metaDescription", description);
    setMeta("ogTitle", title);
    setMeta("ogDescription", description);
    setMeta("ogImage", image);
    setMeta("ogUrl", url);
    setMeta("twitterTitle", title);
    setMeta("twitterDescription", description);
    setMeta("twitterImage", image);
    setMeta("twitterUrl", url);

    const canonical = document.getElementById("metaCanonical");
    if (canonical) canonical.setAttribute("href", url);

    const schemaEl = document.getElementById("articleSchema");
    if (schemaEl) {
      schemaEl.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "NewsArticle",
        "headline": title,
        "image": [image],
        "description": description,
        "author": {
          "@type": "Person",
          "name": author
        },
        "publisher": {
          "@type": "Organization",
          "name": "BoonNews",
          "logo": {
            "@type": "ImageObject",
            "url": "https://boonnews.vercel.app/boon-news-og-banner.jpg"
          }
        }
      });
    }
  }

  async function processRewardPoints(userId, id) {
    const userRef = doc(db, "users", userId);
    const alertBox = document.getElementById("rewardAlertContainer");

    try {
      const userDoc = await getDoc(userRef);

      if (userDoc.exists()) {
        const userData = userDoc.data();
        const readArticles = userData.readArticles || [];

        if (!readArticles.includes(id)) {
          await updateDoc(userRef, {
            points: increment(10),
            readArticles: arrayUnion(id)
          });

          alertBox.innerHTML = `
            <div class="points-alert mb-4 d-flex align-items-center justify-content-between">
              <span><i class="fa fa-gift me-2"></i><strong>Earned Points!</strong> You received +10 points for reading this article.</span>
              <span class="badge bg-warning text-dark"><i class="fa fa-coins me-1"></i>+10</span>
            </div>
          `;
        }
      } else {
        await setDoc(userRef, {
          points: 10,
          readArticles: [id]
        });

        alertBox.innerHTML = `
          <div class="points-alert mb-4 d-flex align-items-center justify-content-between">
            <span><i class="fa fa-gift me-2"></i><strong>Welcome!</strong> You received your first +10 points!</span>
            <span class="badge bg-warning text-dark"><i class="fa fa-coins me-1"></i>+10</span>
          </div>
        `;
      }
    } catch (err) {
      console.error("Error rewarding points:", err);
    }
  }

  function showGuestNotice() {
    const alertBox = document.getElementById("rewardAlertContainer");
    alertBox.innerHTML = `
      <div class="alert alert-dark border-secondary mb-4 d-flex align-items-center justify-content-between text-white-50">
        <span style="font-size: 0.9rem;"><i class="fa fa-info-circle text-info me-2"></i>Want to earn points for reading?</span>
        <a href="login.html" class="btn btn-sm btn-primary rounded-pill">Log In</a>
      </div>
    `;
  }
</script>

</body>
</html>
